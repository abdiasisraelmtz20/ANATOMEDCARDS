<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#042D5A">
<title>MEDCARDS · Anatomía 1er Parcial · MEDSTUDENTS</title>
<style>
:root {
  --navy:#042D5A; --red:#EF4150; --ink:#132338; --muted:#6E7D8D;
  --bg:#EEF3F8; --card:#fff; --line:#DCE5EE;
  --shadow:0 16px 44px rgba(4,45,90,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
.header{
  min-height:74px;background:var(--navy);color:#fff;padding:10px clamp(12px,2.5vw,28px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  position:sticky;top:0;z-index:20;box-shadow:0 5px 20px rgba(4,45,90,.16)
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:54px;height:54px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.06);flex:none}
.brand-copy{min-width:0}
.brand-copy b{display:block;font-size:clamp(13px,2vw,17px);letter-spacing:.07em}
.brand-copy span{display:block;font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
 border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;
 width:40px;height:40px;border-radius:12px;cursor:pointer;font-weight:800
}
.toolbar{
 background:#fff;border-bottom:1px solid var(--line);padding:10px clamp(12px,2.5vw,28px);
 display:grid;grid-template-columns:minmax(180px,260px) 1fr auto;gap:12px;align-items:center
}
.select{
 width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--navy);
 background:#fff;font-weight:800;outline:none
}
.progress-area{display:flex;align-items:center;gap:10px}
.progress{height:8px;background:#E7EDF4;border-radius:999px;overflow:hidden;flex:1}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff7b87);transition:.25s}
.counter{font-weight:900;color:var(--navy);font-size:12px;min-width:74px;text-align:right}
.section-chip{
 font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--red);
 border:1px solid rgba(239,65,80,.22);background:#fff4f5;border-radius:999px;padding:8px 11px;white-space:nowrap
}
.stage{min-height:0;padding:8px 10px 10px;display:grid;place-items:center;position:relative;overflow:hidden}
.viewer{width:min(860px,100%);height:100%;min-height:0;display:grid;place-items:center;position:relative}
.card-wrap{width:100%;height:100%;background:#fff;border:1px solid rgba(4,45,90,.08);border-radius:20px;box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;position:relative;padding:6px}
.card-image{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.loading{
 position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:var(--muted);
 font-weight:800;transition:.2s
}
.loading.hidden{opacity:0;pointer-events:none}
.nav-float{
 position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:16px;
 background:rgba(4,45,90,.92);color:#fff;font-size:23px;font-weight:800;cursor:pointer;
 box-shadow:0 8px 22px rgba(4,45,90,.2);z-index:5
}
.nav-float:hover{background:var(--navy)}
.nav-float.prev{left:-66px} .nav-float.next{right:-66px}
.footer{
 background:#fff;border-top:1px solid var(--line);padding:10px clamp(10px,2vw,24px) max(10px,env(safe-area-inset-bottom));
 display:flex;justify-content:center
}
.footer-row{width:min(960px,100%);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{
 border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:850;padding:10px 14px;border-radius:13px;cursor:pointer
}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--red);border-color:var(--red);color:#fff}
.btn.active{border-color:var(--red);color:var(--red);box-shadow:0 0 0 3px rgba(239,65,80,.10)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.mini{font-size:11px;color:var(--muted);margin-left:auto}
.toast{
 position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);
 background:#102A46;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:800;
 opacity:0;pointer-events:none;transition:.2s;z-index:99
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){
 .nav-float{display:none}
 .viewer{height:min(69vh,740px)}
}
@media(max-width:650px){
 .header{min-height:64px;padding:8px 11px}
 .logo{width:46px;height:46px}
 .brand-copy b{font-size:13px} .brand-copy span{font-size:10px}
 .toolbar{grid-template-columns:1fr auto;gap:8px;padding:8px 10px}
 .progress-area{grid-column:1/-1;grid-row:2}
 .viewer{height:64vh;min-height:360px}
 .stage{padding:10px}
 .card-wrap{border-radius:17px}
 .mini{width:100%;text-align:center;margin:0}
 .btn{padding:9px 11px}
}

.btn.favorite-active{
  background:#FFF7D6;
  border-color:#F3C64D;
  color:#7A5A00;
  box-shadow:0 0 0 3px rgba(243,198,77,.15);
}

</style>
</head>

  </footer>
</div>

let filter = "all";
let pool = ALL_CARDS.map((_,i)=>i);
let pos = 0;
let shuffled = false;
let touchStartX = null;

const img = document.getElementById("cardImage");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const chip = document.getElementById("chip");
const sectionSelect = document.getElementById("sectionSelect");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const prevFloat = document.getElementById("prevFloat");
const nextFloat = document.getElementById("nextFloat");
const shuffleBtn = document.getElementById("shuffleBtn");
const firstBtn = document.getElementById("firstBtn");
const favoriteBtn = document.getElementById("favoriteBtn");
const favCount = document.getElementById("favCount");
const FAVORITES_KEY = "medstudents_anatomia_1p_favorites_v1";
let favorites = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]"));
const fullscreenBtn = document.getElementById("fullscreenBtn");
const toast = document.getElementById("toast");
const stage = document.getElementById("stage");

function showToast(msg){
  toast.textContent=msg; toast.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>toast.classList.remove("show"),1300);
}
function filteredPool(){
  return ALL_CARDS.map((c,i)=>({c,i})).filter(x=>filter==="all"||x.c.sectionKey===filter).map(x=>x.i);
}
function fisher(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  return b;
}
function rebuildPool(reset=true){
  pool=filteredPool();
  if(shuffled) pool=fisher(pool);
  if(reset) pos=0;
  if(!pool.length){
    img.removeAttribute("src");
    img.alt="";
    loading.classList.remove("hidden");
    loading.innerHTML = filter==="favorites"
      ? "Aún no has marcado ninguna MEDCARD.<br><small>Usa ☆ Marcar para repasar.</small>"
      : "No hay MEDCARDS en este bloque.";
    counter.textContent="0 / 0";
    bar.style.width="0%";
    chip.textContent=filter==="favorites" ? "Mis marcadas" : "Sin tarjetas";
    favoriteBtn.disabled=true;
    return;
  }
  favoriteBtn.disabled=false;
  loading.innerHTML="Cargando MEDCARD…";
  render();
}
function preload(index){
  if(index<0||index>=pool.length)return;
  const pre=new Image(); pre.src=ALL_CARDS[pool[index]].src;
}

function saveFavorites(){
  localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
  updateFavoriteUI();
}
function currentCard(){
  if(!pool.length) return null;
  return ALL_CARDS[pool[pos]];
}
function updateFavoriteUI(){
  favCount.textContent = `⭐ ${favorites.size}`;
  const card = currentCard();
  if(!card){
    favoriteBtn.classList.remove("favorite-active");
    favoriteBtn.textContent="☆ Marcar para repasar";
    return;
  }
  const marked = favorites.has(card.page);
  favoriteBtn.classList.toggle("favorite-active", marked);
  favoriteBtn.textContent = marked ? "★ Marcada para repasar" : "☆ Marcar para repasar";
}
function toggleFavorite(){
  const card=currentCard();
  if(!card) return;
  if(favorites.has(card.page)){
    favorites.delete(card.page);
    showToast("MEDCARD desmarcada");
  } else {
    favorites.add(card.page);
    showToast("MEDCARD guardada para repasar");
  }
  saveFavorites();
  if(filter==="favorites"){
    const oldPage=card.page;
    pool=filteredPool();
    if(!pool.length){
      rebuildPool(true);
      return;
    }
    pos=Math.min(pos,pool.length-1);
    render();
  }
}

function render(){
  if(!pool.length)return;
  const card=ALL_CARDS[pool[pos]];
  loading.classList.remove("hidden");
  img.onload=()=>loading.classList.add("hidden");
  img.src=card.src;
  img.alt=card.label;
  chip.textContent=card.section;
  counter.textContent=`${pos+1} / ${pool.length}`;
  bar.style.width=`${((pos+1)/pool.length)*100}%`;
  prevBtn.disabled=pos===0&&!shuffled;
  nextBtn.disabled=pos===pool.length-1&&!shuffled;
  document.title=`${card.label} · MEDSTUDENTS`;
  updateFavoriteUI();
  preload(pos+1);
  preload(pos-1);
}
function next(){
  if(pos<pool.length-1)pos++;
  else if(shuffled)pos=0;
  render();
}
function prev(){
  if(pos>0)pos--;
  else if(shuffled)pos=pool.length-1;
  render();
}
function goFirst(){pos=0;render();showToast("Inicio del bloque")}
function toggleShuffle(){
  shuffled=!shuffled;
  shuffleBtn.classList.toggle("active",shuffled);
  shuffleBtn.textContent=shuffled?"Aleatorio ✓":"Aleatorio";
  rebuildPool(true);
  showToast(shuffled?"Orden aleatorio activado":"Orden original restaurado");
}
async function fullscreen(){
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){showToast("Fullscreen no disponible en este navegador")}
}
sectionSelect.addEventListener("change",e=>{filter=e.target.value;rebuildPool(true)});
prevBtn.onclick=prev; nextBtn.onclick=next; prevFloat.onclick=prev; nextFloat.onclick=next;
shuffleBtn.onclick=toggleShuffle; firstBtn.onclick=goFirst; favoriteBtn.onclick=toggleFavorite; fullscreenBtn.onclick=fullscreen;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});
stage.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{
  if(touchStartX===null)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>55) dx<0?next():prev();
  touchStartX=null;
},{passive:true});
favCount.textContent = `⭐ ${favorites.size}`;
render();
</script>
